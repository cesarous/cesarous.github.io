<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cesar Rodriguez</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewriting, so a direct load or
      // refresh on a route like /projects 404s here. This redirects back to
      // index.html with the original path packed into the query string;
      // index.html's own script unpacks it via history.replaceState before
      // React Router ever reads the URL, so the right page renders.
      // pathSegmentsToKeep = 0 because this is a user page (cesarous.github.io)
      // served from the domain root, not a project page under a subpath.
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
